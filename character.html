<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="page-title">حکایت‌های ملانصرالدین</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-vazir min-h-screen">

  <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b dark:border-gray-800">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl font-bold">بانک حکایت</h1>
      <div class="flex gap-4">
        <a href="index.html" id="back-button" class="flex items-center gap-2 text-lg hover:text-primary transition">
          <i class="fa-solid fa-arrow-right"></i> بازگشت
        </a>
        <button id="theme-toggle" class="p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800">
          <i class="fa-solid fa-moon text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="container mx-auto px-4 pt-32 pb-20 text-center">
    <h1 id="character-name" class="text-5xl md:text-7xl font-bold mb-10" data-aos="fade-down"></h1>
    <img id="character-image" loading="lazy" class="mx-auto rounded-3xl shadow-2xl max-w-full h-auto" data-aos="zoom-in">

    <div class="max-w-2xl mx-auto my-12">
      <input type="search" id="stories-search" placeholder="جستجوی حکایت..." class="w-full px-12 py-4 rounded-full bg-gray-100 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary text-lg">
      <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-gray-500"></i>
    </div>

    <div id="stories-list" class="grid gap-8 md:grid-cols-2 lg:grid-cols-3 max-w-6xl mx-auto"></div>
  </main>

  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
    <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl animate-modal">
      <div class="sticky top-0 bg-inherit p-6 border-b dark:border-gray-800 flex justify-between items-center">
        <h2 id="story-title" class="text-2xl md:text-3xl font-bold"></h2>
        <button class="close text-4xl hover:text-red-500">&times;</button>
      </div>
      <div class="p-8 leading-10 text-lg" id="story-text"></div>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
