<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="بانک جامع حکایت‌ها و داستان‌های فارسی - ملانصرالدین، سعدی، حافظ و..."/>
  <title>بانک حکایت و داستان</title>

  <!-- Tailwind CSS v3.4+ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] },
          colors: { primary: '#d97706' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-vazir min-h-screen transition-colors duration-500">

  <!-- Header ثابت -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl md:text-3xl font-bold">بانک حکایت و داستان</h1>
      
      <div class="flex items-center gap-3">
        <input type="search" id="global-search" placeholder="جستجوی شخصیت یا حکایت..." 
               class="w-48 md:w-80 px-10 py-2.5 rounded-full bg-gray-100 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary transition text-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-8 md:left-96 text-gray-500 pointer-events-none"></i>

        <button id="theme-toggle" class="p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-moon text-xl"></i>
        </button>

        <button id="language-switch" class="px-5 py-2.5 bg-primary text-white rounded-xl hover:bg-amber-600 transition font-medium">EN</button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 pt-24 pb-16">
    <div id="search-results-message" class="text-center py-12 text-lg text-gray-600 dark:text-gray-400 hidden"></div>
    
    <div id="characters-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 md:gap-8"></div>
  </main>

  <!-- سایدبار شاعران -->
  <button id="sidebar-toggle" class="fixed top-20 right-4 z-50 bg-primary text-white p-4 rounded-full shadow-2xl hover:bg-amber-600 transition transform hover:scale-110">
    <i class="fa-solid fa-list text-xl"></i>
  </button>

  <aside id="poets-sidebar" class="fixed inset-y-0 left-0 w-80 bg-white dark:bg-gray-900 shadow-2xl transform -translate-x-full transition-transform duration-500 z-50 overflow-y-auto">
    <div class="p-6 border-b dark:border-gray-800">
      <div class="flex justify-between items-center">
        <h2 class="text-2xl font-bold">شاعران و حکیمان</h2>
        <button class="close-btn text-3xl hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full w-12 h-12">&times;</button>
      </div>
    </div>
    <ul id="poets-list" class="p-4 space-y-2"></ul>
  </aside>

  <!-- Modal حکایت -->
  <div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-50 p-4" onclick="if(event.target===this) closeModal()">
    <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-4xl w-full max-h-[90vh] overflow-y-auto shadow-2xl animate-modal">
      <div class="sticky top-0 bg-inherit p-6 border-b dark:border-gray-800 flex justify-between items-center">
        <h2 id="story-title" class="text-2xl md:text-3xl font-bold"></h2>
        <button class="close text-4xl hover:text-red-500 transition">&times;</button>
      </div>
      <div class="p-8 leading-9 text-lg" id="story-text"></div>
    </div>
  </div>

  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
