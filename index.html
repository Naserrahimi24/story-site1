<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="بانک جامع حکایت‌ها و داستان‌های فارسی - سعدی، کلیله و دمنه، ملانصرالدین و... | Comprehensive Persian Tales & Stories Bank"/>
  
  <title data-lang="fa">بانک حکایت و داستان</title>
  <title data-lang="en" class="hidden">Persian Tales Bank</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { vazir: ['Vazirmatn', 'sans-serif'] },
          colors: { primary: '#d97706' }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-vazir min-h-screen transition-colors duration-500">

  <!-- Header -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-white/90 dark:bg-gray-900/90 backdrop-blur-md border-b border-gray-200 dark:border-gray-800">
    <div class="container mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-2xl md:text-3xl font-bold">
        <span data-lang="fa">بانک حکایت و داستان</span>
        <span data-lang="en" class="hidden">Persian Tales Bank</span>
      </h1>
      
      <div class="flex items-center gap-3">
        <div class="relative">
          <input type="search" id="global-search" 
                 placeholder-fa="جستجوی شخصیت یا حکایت..." 
                 placeholder-en="Search character or tale..."
                 class="w-48 md:w-80 pl-12 pr-4 py-2.5 rounded-full bg-gray-100 dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-primary transition text-sm">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
        </div>

        <button id="theme-toggle" class="p-3 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-800 transition">
          <i class="fa-solid fa-moon text-xl"></i>
        </button>

        <button id="language-switch" class="px-5 py-2.5 bg-primary text-white rounded-xl hover:bg-amber-600 transition font-medium">EN</button>

        <!-- دکمه باز کردن سایدبار کتاب‌ها (در هدر) -->
        <button id="open-books-sidebar" class="p-3 rounded-xl bg-primary text-white hover:bg-amber-700 transition">
          <i class="fa-solid fa-book-open text-xl"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container mx-auto px-4 pt-24 pb-16">
    <div id="search-results-message" class="text-center py-12 text-lg text-gray-600 dark:text-gray-400 hidden">
      <span data-lang="fa">هیچ نتیجه‌ای یافت نشد.</span>
      <span data-lang="en" class="hidden">No results found.</span>
    </div>
    <div id="characters-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6 md:gap-8"></div>
  </main>

  <!-- دکمه قدیمی سایدبار شاعران (برگشت!) -->
  <button id="sidebar-toggle" class="fixed top-20 right-4 z-50 bg-primary text-white p-4 rounded-full shadow-2xl hover:bg-amber-600 transition hover:scale-110">
    <i class="fa-solid fa-list text-xl"></i>
  </button>

  <!-- سایدبار قدیمی شاعران (دقیقاً همون قبلی) -->
  <aside id="poets-sidebar" class="fixed inset-y-0 left-0 w-80 bg-white dark:bg-gray-900 shadow-2xl transform -translate-x-full transition-transform duration-500 z-50 overflow-y-auto">
    <div class="p-6 border-b dark:border-gray-800 flex justify-between items-center">
      <h2 class="text-2xl font-bold">
        <span data-lang="fa">شاعران و حکیمان</span>
        <span data-lang="en" class="hidden">Poets & Sages</span>
      </h2>
      <button class="close-btn text-3xl hover:bg-gray-200 dark:hover:bg-gray-800 rounded-full w-12 h-12">×</button>
    </div>
    <ul id="poets-list" class="p-4 space-y-2"></ul>
  </aside>

  <!-- سایدبار جدید کتاب‌ها (دوزبانه و کامل) -->
  <aside id="books-sidebar" 
         class="fixed inset-y-0 right-0 w-96 lg:w-[420px] bg-gradient-to-b from-amber-50/95 to-amber-100/95 
                dark:from-gray-900/95 dark:to-gray-950/95 shadow-2xl transform translate-x-full 
                transition-transform duration-500 ease-out z-50 overflow-y-auto backdrop-blur-xl flex flex-col">

    <header class="sticky top-0 z-10 bg-white/80 dark:bg-gray-900/90 backdrop-blur-xl border-b border-amber-200 dark:border-gray-800 px-6 py-5">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-2xl lg:text-3xl font-bold flex items-center gap-3 text-amber-700 dark:text-amber-400">
          <i class="fa-solid fa-book-open-reader text-3xl lg:text-4xl"></i>
          <span data-lang="fa">کتاب‌های مشهور</span>
          <span data-lang="en" class="hidden">Famous Books</span>
        </h2>
        <button id="close-books-sidebar" class="w-12 h-12 rounded-full hover:bg-amber-200 dark:hover:bg-gray-800 transition-all flex items-center justify-center text-3xl text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white">
          ×
        </button>
      </div>

      <div class="relative">
        <i class="fa-solid fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg pointer-events-none"></i>
        <input type="text" id="books-search-input"
               class="w-full pl-12 pr-12 py-4 rounded-2xl border border-amber-300/50 dark:border-gray-700 bg-white/70 dark:bg-gray-800/70 focus:outline-none focus:ring-4 focus:ring-amber-400/30 focus:border-amber-500 dark:focus:border-amber-600 transition-all text-base"
               placeholder-fa="جستجو در کتاب‌ها و فصل‌ها..." 
               placeholder-en="Search in books & chapters..."
               autocomplete="off">
        <button id="books-search-clear" class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-red-500 transition">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <div id="books-results-count" class="mt-3 text-center text-sm font-medium text-amber-600 dark:text-amber-400 opacity-0 transition-opacity">
        <span data-lang="fa">کتاب یافت شد</span>
        <span data-lang="en" class="hidden">books found</span>
      </div>
    </header>

    <div class="flex-1 px-6 py-6 space-y-6 overflow-y-auto" id="books-container"></div>

    <footer class="p-6 text-center text-sm text-gray-500 dark:text-gray-400 border-t border-amber-200/50 dark:border-gray-800 bg-white/50 dark:bg-gray-900/50 backdrop-blur-sm">
      <p data-lang="fa">به زودی کتاب‌های بیشتری اضافه خواهد شد</p>
      <p data-lang="en" class="hidden">More books coming soon</p>
    </footer>
  </aside>

  <!-- مودال کتاب -->
  <div id="book-modal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center z-50 p-4" onclick="if(event.target===this) this.classList.add('hidden')">
    <div class="bg-white dark:bg-gray-900 rounded-3xl max-w-5xl w-full max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="sticky top-0 bg-inherit p-6 border-b dark:border-gray-800 flex justify-between items-center backdrop-blur-sm">
        <h2 id="modal-book-title" class="text-2xl md:text-3xl font-bold text-primary">
          <span data-lang="fa">عنوان کتاب</span>
          <span data-lang="en" class="hidden">Book Title</span>
        </h2>
        <button class="text-4xl hover:text-red-500 transition close-modal">×</button>
      </div>
      <div class="p-8 space-y-10" id="modal-book-content"></div>
    </div>
  </div>

  <!-- اسکریپت‌ها -->
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script>AOS.init({ once: true, duration: 800 });</script>

  <!-- سوئیچ زبان کامل (شامل placeholder و aria-label) -->
  <script>
    const langSwitch = document.getElementById('language-switch');
    const html = document.documentElement;
    let currentLang = 'fa';

    function updatePlaceholders() {
      document.querySelectorAll('input[placeholder-fa]').forEach(el => {
        el.placeholder = currentLang === 'fa' ? el.getAttribute('placeholder-fa') : el.getAttribute('placeholder-en');
      });
    }

    langSwitch.addEventListener('click', () => {
      if (currentLang === 'fa') {
        html.lang = 'en';
        html.dir = 'ltr';
        document.querySelectorAll('[data-lang="fa"]').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('[data-lang="en"]').forEach(el => el.classList.remove('hidden'));
        langSwitch.textContent = 'FA';
        currentLang = 'en';
      } else {
        html.lang = 'fa';
        html.dir = 'rtl';
        document.querySelectorAll('[data-lang="en"]').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('[data-lang="fa"]').forEach(el => el.classList.remove('hidden'));
        langSwitch.textContent = 'EN';
        currentLang = 'fa';
      }
      updatePlaceholders();
    });

    updatePlaceholders();
  </script>

  <script type="module" src="script.js"></script>
  <!-- اگر فایل books-sidebar.js داری، این خط رو هم داشته باش -->
  <script type="module" src="books-sidebar.js"></script>
</body>
</html>
